<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f1efe9"><meta name="description" content="垫哪边。把手机平放在桌面或机器顶部，测出四个脚分别需要升高多少毫米。"><meta property="og:title" content="垫哪边"><meta property="og:description" content="原地转 180° 测两次，抵消手机零偏，再直接计算四个脚要升高多少毫米。"><title>垫哪边</title><link rel="stylesheet" href="./style.css?v=202608121542"></head><body><main class="shell" id="home"><header class="top"><a class="identity" href="../" aria-label="回首页"><span class="mark" aria-hidden="true"><i></i><b></b><em></em><strong></strong></span><span>垫哪边</span></a></header><section class="intro"><div class="hero" aria-hidden="true"><span class="plane"></span><i></i><b></b><em></em><strong></strong><small>+3.5</small></div><div class="copy"><span class="serial">13</span><h1>垫哪边</h1><p>把手机平放在桌面、洗衣机或机器顶部，测两次后直接计算四个脚分别需要升高多少毫米。</p></div><div class="dimensions"><label><span>左右脚距</span><div><input id="widthInput" type="number" inputmode="decimal" min="5" max="500" step="0.1" placeholder="例如 58"><em>cm</em></div></label><label><span>前后脚距</span><div><input id="depthInput" type="number" inputmode="decimal" min="5" max="500" step="0.1" placeholder="例如 52"><em>cm</em></div></label></div><button class="start" id="start" type="button"><span>开始找平</span><b aria-hidden="true">↗</b></button><small class="note">脚距指四个支撑脚之间的实际距离。手机屏幕朝上，顶部朝物体前方。</small><p class="error" id="error" hidden role="alert"></p></section></main><section class="meter" id="meter" hidden><header class="meter-top"><button id="exit" type="button">退出</button><div class="status"><strong id="statusTitle">第一遍</strong><span id="statusSub">手机顶部朝前</span></div><button id="cancel" type="button">取消</button></header><div class="measure" id="measure"><div class="orientation" id="orientation"><span class="front">前</span><div class="phone"><i></i><b></b></div><span class="left">左</span><span class="right">右</span><span class="back">后</span></div><div class="readout"><strong id="measureValue">2.0</strong><span id="measureText">放稳手机</span></div></div><section class="turn" id="turn" hidden><div class="turn-graphic" aria-hidden="true"><div class="phone"><i></i></div><span>180°</span></div><strong>原地转 180°</strong><p>不要翻面，也不要换位置。让手机底部改为朝物体前方。</p><button id="second" type="button">已经转好 <b>↗</b></button><small>第二遍会抵消手机自身的零点偏差。</small></section><section class="result" id="result" hidden><header><span>调整结果</span><strong id="resultState">双次校正</strong></header><div class="summary"><div><span>左右高差</span><strong id="lrValue">—</strong><small>mm</small></div><div><span>前后高差</span><strong id="fbValue">—</strong><small>mm</small></div></div><div class="feet"><span class="front-label">前</span><div class="foot lf"><span>左前</span><strong id="lf">—</strong><small>mm</small></div><div class="foot rf"><span>右前</span><strong id="rf">—</strong><small>mm</small></div><div class="foot lb"><span>左后</span><strong id="lb">—</strong><small>mm</small></div><div class="foot rb"><span>右后</span><strong id="rb">—</strong><small>mm</small></div><span class="back-label">后</span></div><p class="instruction" id="instruction">—</p><div class="result-actions"><button class="primary" id="again" type="button">调完再测</button><button id="finish" type="button">结束</button></div><p class="quality" id="quality">数值按 0.5 mm 取整。适用于刚性顶面和四角支撑；如果物体本身会晃或某只脚悬空，需要另行检查接触状态。</p></section></section><script src="./app.js?v=202608121542"></script></body></html>

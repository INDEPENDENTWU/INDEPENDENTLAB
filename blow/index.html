<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f1efe9"><meta name="description" content="免手翻页。打开 PDF、EPUB、图片、长图或文字，双手不方便碰屏幕时，用吹气、自己的声音或无声嘴型向前翻。"><meta property="og:title" content="免手翻页"><meta property="og:description" content="把嘴临时变成一个翻页按钮。"><title>免手翻页</title><link rel="stylesheet" href="./style.css?v=202608130356"><link rel="stylesheet" href="./v4.css?v=202608130356"></head><body><main class="shell" id="home"><header class="top"><a class="identity" href="../" aria-label="回首页"><span class="mark" aria-hidden="true"><i></i><b></b><em></em></span><span>免手翻页</span></a></header><section class="intro"><div class="hero" aria-hidden="true"><span class="sheet one"></span><span class="sheet two"></span><i></i><b></b><em></em></div><div class="copy"><span class="serial">13</span><h1>免手翻页</h1><p>双手不方便碰屏幕时，把嘴临时变成翻页按钮。打开内容后，吹一下、发一个自己的短声，或者不出声做嘴型都可以向前。</p></div><div class="source-actions"><button id="choose" type="button"><span>选择内容</span><b aria-hidden="true">↗</b></button><button id="pasteOpen" type="button"><span>粘贴文字</span><b aria-hidden="true">＋</b></button></div><input id="files" type="file" accept="application/pdf,image/*,.epub,text/plain,text/markdown,.txt,.md,.markdown" multiple hidden><small class="source-note">支持 PDF、EPUB、多张图片、长图和文字。长图会自动分页；粘贴步骤可以一条一条显示。文件、相机和麦克风内容都在当前设备处理。</small><p class="error" id="error" hidden role="alert"></p></section></main><section class="reader" id="reader" hidden><header class="reader-top"><button id="exit" type="button">退出</button><div class="reader-title"><strong>免手翻页</strong><span id="fileKind">内容</span></div><button id="actionBtn" type="button">动作</button></header><div class="stage" id="stage"><canvas id="pdfCanvas" hidden></canvas><img id="imagePage" alt="当前页面" hidden><article class="text-page" id="textPage" hidden><span class="step-no" id="stepNo" hidden>01</span><div class="page-body" id="textBody"></div></article><video id="faceVideo" class="face-video" playsinline muted></video><span class="file-kind" id="fileKindBadge" hidden></span><div class="loading" id="loading" hidden><strong>正在打开</strong><span id="loadingNote">请稍候</span></div><div class="edge edge-prev" id="edgePrev"></div><div class="edge edge-next" id="edgeNext"></div><div class="calibration" id="permission" hidden><div class="calibration-card compact"><span>免手操作</span><strong id="permissionTitle">吹一下就能翻</strong><p id="permissionHint">只需要一次权限，不需要先录吹气。</p><button id="permissionAction" type="button">开启</button></div></div></div><footer class="reader-bottom"><div class="page-status"><strong id="pageNow">1</strong><span>/</span><span id="pageTotal">1</span></div><div class="handsfree-center"><div class="handsfree-status"><i id="statusDot"></i><span id="statusText">免手操作未开启</span></div><button class="action-link" id="actionBtnBottom" type="button">换个动作</button></div><div class="manual"><button id="prev" type="button" aria-label="上一页">←</button><button id="next" type="button" aria-label="下一页">→</button></div></footer></section><div class="measure-text text-page" id="measureText" aria-hidden="true"></div><section class="paste-sheet" id="pasteSheet" hidden><div class="sheet-card"><div class="sheet-head"><strong>粘贴内容</strong><button id="pasteClose" type="button">关闭</button></div><textarea id="pasteText" placeholder="把菜谱、说明、讲稿、步骤或任何要边做边看的文字贴在这里。"></textarea><div class="paste-modes" id="pasteModes"><button class="active" data-mode="pages" type="button"><strong>按页阅读</strong><small>自动排成适合屏幕的页</small></button><button data-mode="steps" type="button"><strong>一步一步</strong><small>每次只看当前一步</small></button></div><button class="sheet-primary" id="pasteUse" type="button">打开</button></div></section><section class="action-sheet" id="actionSheet" hidden><div class="sheet-card"><div class="sheet-head"><strong>换个动作</strong><button id="actionClose" type="button">关闭</button></div><div class="action-options" id="actionOptions"><button data-mode="blow" type="button"><span><strong>吹气</strong><small>不用录制，短吹向前，长吹返回</small></span><em>选择</em></button><button data-mode="voice" type="button"><span><strong>我的声音</strong><small>把「啧」「嗯」「过」或任意短声变成按钮</small></span><em>选择</em></button><button data-mode="mouth" type="button"><span><strong>无声嘴型</strong><small>短嘟嘴向前，保持一下返回</small></span><em>选择</em></button></div><div class="learn-card" id="learnPanel" hidden><strong>做三次同样的声音</strong><div class="learn-dots" id="learnDots"><i></i><i></i><i></i></div><p id="learnHint">例如「啧」「嗯」「过」。</p></div></div></section><script src="../split/cutter.js?v=202608130356"></script><script src="./v4.js?v=202608130356"></script><script>document.getElementById('actionBtnBottom').onclick=()=>document.getElementById('actionBtn').click()</script></body></html>

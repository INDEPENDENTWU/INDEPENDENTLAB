<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f1efe9"><meta name="description" content="免手翻页。打开 PDF、EPUB、图片、长图或文字，说口令或用无声嘴型前后翻页。"><meta property="og:title" content="免手翻页"><meta property="og:description" content="双手不方便碰屏幕时，用口令或嘴型前后翻页。"><title>免手翻页</title><link rel="stylesheet" href="./style.css?v=202608131213"><link rel="stylesheet" href="./v4.css?v=202608131213"><link rel="stylesheet" href="./v5.css?v=202608131213"><link rel="stylesheet" href="./v7.css?v=202608131213"></head><body><main class="shell" id="home"><header class="top"><a class="identity" href="../" aria-label="回首页"><span class="mark" aria-hidden="true"><i></i><b></b><em></em></span><span>免手翻页</span></a></header><section class="intro"><div class="hero" aria-hidden="true"><span class="sheet one"></span><span class="sheet two"></span><i></i><b></b><em></em></div><div class="copy"><span class="serial">13</span><h1>免手翻页</h1><p>双手不方便碰屏幕时，直接说“下一页 / 上一页”，也可以换成自己的口令；不想出声时，用嘟嘴和张嘴前后翻。</p></div><div class="source-actions"><button id="choose" type="button"><span>选择内容</span><b aria-hidden="true">↗</b></button><button id="pasteOpen" type="button"><span>粘贴文字</span><b aria-hidden="true">＋</b></button></div><input id="files" type="file" accept="application/pdf,image/*,.epub,text/plain,text/markdown,.txt,.md,.markdown" multiple hidden><small class="source-note">支持 PDF、EPUB、多张图片、长图和文字。自定义口令保留在当前设备；换文件不用重设。无声嘴型才会使用前置相机。</small><p class="error" id="error" hidden role="alert"></p></section></main><section class="reader" id="reader" hidden><header class="reader-top"><button id="exit" type="button">退出</button><div class="reader-title"><strong>免手翻页</strong><span id="fileKind">内容</span></div><button id="actionBtn" type="button">动作</button></header><div class="stage" id="stage"><canvas id="pdfCanvas" hidden></canvas><img id="imagePage" alt="当前页面" hidden><article class="text-page" id="textPage" hidden><span class="step-no" id="stepNo" hidden>01</span><div class="page-body" id="textBody"></div></article><video id="faceVideo" playsinline muted></video><div class="loading" id="loading" hidden><strong>正在打开</strong><span id="loadingNote">请稍候</span></div><div class="edge edge-prev" id="edgePrev"></div><div class="edge edge-next" id="edgeNext"></div><div class="calibration" id="permission" hidden><div class="calibration-card compact"><span>免手操作</span><strong id="permissionTitle">开启口令</strong><p id="permissionHint">直接说“下一页 / 上一页”。</p><button id="permissionAction" type="button">开启</button></div></div></div><footer class="reader-bottom"><div class="page-status"><strong id="pageNow">1</strong><span>/</span><span id="pageTotal">1</span></div><div class="handsfree-center"><div class="handsfree-status"><i id="statusDot"></i><span id="statusText">免手操作未开启</span></div><div class="mouth-dock" id="mouthDock" hidden aria-label="口型识别状态"><canvas id="mouthPeek" width="68" height="24"></canvas><span id="mouthDockText">找口型</span></div><button class="action-link" id="actionBtnBottom" type="button">换个动作</button></div><div class="manual"><button id="prev" type="button" aria-label="上一页">←</button><button id="next" type="button" aria-label="下一页">→</button></div></footer></section><div class="measure-text text-page" id="measureText" aria-hidden="true"></div><section class="paste-sheet" id="pasteSheet" hidden><div class="sheet-card"><div class="sheet-head"><strong>粘贴内容</strong><button id="pasteClose" type="button">关闭</button></div><textarea id="pasteText" placeholder="把菜谱、说明、讲稿、步骤或任何要边做边看的文字贴在这里。"></textarea><div class="paste-modes" id="pasteModes"><button class="active" data-mode="pages" type="button"><strong>按页阅读</strong><small>自动排成适合屏幕的页</small></button><button data-mode="steps" type="button"><strong>一步一步</strong><small>每次只看当前一步</small></button></div><button class="sheet-primary" id="pasteUse" type="button">打开</button></div></section><section class="action-sheet" id="actionSheet" hidden><div class="sheet-card"><div class="sheet-head"><strong>换个动作</strong><button id="actionClose" type="button">关闭</button></div><div class="action-options" id="actionOptions"><button data-mode="command" type="button"><span><strong>我的口令</strong><small>默认“下一页 / 上一页”，也可以各说一次自己的口令</small></span><em>选择</em></button><button data-mode="mouth" type="button"><span><strong>无声嘴型</strong><small>明确嘟嘴向前 · 明确张嘴返回</small></span><em>选择</em></button></div><div class="command-setup" id="commandSetup" hidden><div class="command-row"><span><small>向前</small><strong id="forwardPhrase">下一页</strong></span><button id="changeForward" type="button">改口令</button></div><div class="command-row"><span><small>返回</small><strong id="backPhrase">上一页</strong></span><button id="changeBack" type="button">改口令</button></div><p class="command-note">每个方向只说一次。工具记住的是识别到的词，不是单纯记音色；换内容后继续使用。</p><button class="command-reset" id="resetCommands" type="button">恢复“下一页 / 上一页”</button><button class="sheet-primary" type="button" onclick="document.getElementById('actionSheet').hidden=true">完成</button></div></div></section><section class="listen-capture" id="listenCapture" hidden><div class="listen-card"><span>我的口令</span><strong id="captureTitle">说一次向前口令</strong><div class="listen-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><p id="captureHint">说一个平时不会随口讲出的短词或短句，准确率会更高。</p><button id="captureCancel" type="button">取消</button></div></section><script src="../split/cutter.js?v=202608131213"></script><script src="./v7.js?v=202608131213"></script><script>document.getElementById('actionBtnBottom').onclick=()=>document.getElementById('actionBtn').click()</script></body></html>

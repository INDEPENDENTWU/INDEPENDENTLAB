<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f3f2ed"><meta name="description" content="暗举手。几个人轮流在同一部手机上私下选愿不愿意，最后只从愿意的人里抽一个。"><title>暗举手</title><link rel="stylesheet" href="../assets/foundation.css?v=20260814"><link rel="stylesheet" href="../assets/microcopy.css?v=20260814"><link rel="stylesheet" href="./style.css?v=20260815"></head><body><main class="shell home" id="home"><header class="top"><a class="identity" href="../" aria-label="回首页"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></span><strong>暗举手</strong></a><span class="serial">26</span></header><section class="intro"><div class="hero" aria-hidden="true"><div class="people"><i></i><i></i><i></i><i></i><i></i></div><b></b><em></em></div><div class="copy"><span class="serial">26</span><h1>暗举手</h1><p>几个人轮流在同一部手机上私下选“我可以”或“这次不行”。最后只从愿意的人里抽一个，其他人的选择不公开。</p></div><div class="setup"><label class="task"><span>这次要干嘛</span><input id="task" type="text" maxlength="28" placeholder="拿外卖（可不填）" autocomplete="off"></label><div class="count"><span>几个人</span><div class="stepper"><button id="minus" type="button" aria-label="减少人数">−</button><strong id="count">4</strong><button id="plus" type="button" aria-label="增加人数">＋</button></div></div><button class="primary start" id="start" type="button"><span>开始传手机</span><span aria-hidden="true">↗</span></button><small class="note">每个人选完就把手机交给下一位。最后只显示被抽中的人。</small></div></section></main><section class="session" id="session" hidden><header class="session-top"><button id="exit" type="button">退出</button><strong>暗举手</strong><span>26</span></header><div class="handoff" id="handoff"><span id="handoffStep">1 / 4</span><div class="handoff-mark" aria-hidden="true"><i></i><b></b></div><h2 id="handoffTitle">交给 1 号</h2><p id="handoffText">轮到的人自己点开，别人先别看屏幕。</p><button id="openChoice" type="button">1 号开始</button></div><div class="choice" id="choice" hidden><span id="choiceStep">1 / 4</span><h2 id="choiceTitle">1 号</h2><p>只选你自己的答案。</p><div class="choice-buttons"><button id="yes" type="button"><span>我可以</span><b aria-hidden="true">●</b></button><button id="no" type="button"><span>这次不行</span><b aria-hidden="true">○</b></button></div></div><div class="ready" id="ready" hidden><span>都选好了</span><div class="ready-mark" aria-hidden="true"><i></i><i></i><i></i><b></b></div><h2>现在看结果</h2><p>前面的选择不会再显示。</p><button id="reveal" type="button">看结果</button></div></section><section class="result" id="result" hidden><header class="result-top"><a href="../" aria-label="回首页">INDEPENDENT</a><strong>暗举手</strong><span>26</span></header><div class="result-body"><span class="result-label">这次</span><h2 id="resultPerson">3 号</h2><p id="resultTask">拿外卖</p><div class="result-mark" id="resultMark" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div><small id="resultNote">其他人的选择没有公开。</small><div class="result-actions"><button id="again" type="button">再来一轮</button><button id="newTask" type="button">换件事</button></div></div></section><script src="./app.js?v=20260815"></script></body></html>

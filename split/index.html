<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f1e9"><meta name="description" content="长图分页。别把话切两半。"><meta property="og:title" content="长图分页"><meta property="og:description" content="别把话切两半。"><title>长图分页</title><link rel="stylesheet" href="./style.css"></head><body><main class="split-shell"><header class="top"><a class="identity" href="../" aria-label="回首页"><span class="cut-glyph" aria-hidden="true"><i></i><i></i><i></i></span><span>长图分页</span></a><button class="quiet" id="replaceBtn" type="button" hidden>换一张</button></header><section class="intro" id="intro"><div class="intro-copy"><span class="serial">03</span><h1>长图分页</h1><p>别把话切两半。</p></div><label class="picker"><input id="fileInput" type="file" accept="image/*"><span>选一张长图</span><b aria-hidden="true">↗</b></label><div class="sample" aria-hidden="true"><div class="sample-paper"><span></span><span></span><span></span><i></i><i></i></div><p>自动找空隙，再落刀。</p></div></section><section class="working" id="working" hidden><div class="work-head"><div><p class="eyebrow" id="fileMeta">长图</p><h1 id="workTitle">在找切口。</h1></div><div class="length-control" aria-label="每张长度"><span>每张</span><div class="segments" id="segments"><button type="button" data-ratio="1.48">短</button><button class="active" type="button" data-ratio="1.78">中</button><button type="button" data-ratio="2.08">长</button></div></div></div><div class="desk"><div class="preview-scroll" id="previewScroll"><div class="preview-inner" id="previewInner"><img id="sourcePreview" alt="长图预览"><div class="cut-layer" id="cutLayer"></div></div></div><aside class="side"><p class="summary" id="summary">—</p><p class="hint">蓝线可以拖。</p><button class="save-all" id="saveAll" type="button" disabled><span>保存全部</span><b aria-hidden="true">↗</b></button></aside></div><div class="pages" id="pages" aria-live="polite"></div></section><p class="error" id="

<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f1efe9"><meta name="description" content="哪个才是最终版。选择几份同一文件的不同版本，直接看最后修改的是哪份、哪些只是改名副本。"><meta property="og:title" content="哪个才是最终版"><meta property="og:description" content="别再相信 final_final_真的最终版。"><title>哪个才是最终版</title><link rel="stylesheet" href="./style.css?v=202608131354"></head><body><main class="shell"><header class="top"><a class="identity" href="../"><span class="mark"><i></i><i></i><b>?</b></span><span>哪个才是最终版</span></a></header><section class="intro" id="intro"><div class="hero" aria-hidden="true"><span>FINAL</span><span>final2</span><span>最终版</span><i></i></div><div class="copy"><span class="serial">17</span><h1>哪个才是最终版</h1><p>把几份同一文件的不同版本一起选进来。它不信文件名，直接看最后修改时间和实际内容。</p></div><button class="pick" id="pick" type="button"><span>选择 2–20 个版本</span><b>↗</b></button><input id="files" type="file" multiple hidden><small>文件只在当前设备读取。支持任意文件做时间和完全重复判断；PDF、Word、Excel、PowerPoint、TXT 等还能比较可读取正文。</small><p class="error" id="error" hidden></p></section><section class="busy" id="busy" hidden><span>正在对版本</span><strong id="busyText">先别信文件名</strong><i></i></section><section class="result" id="result" hidden><header class="result-top"><button id="back">返回</button><strong>哪个才是最终版</strong><button id="again">换一组</button></header><div class="result-body"><section class="verdict"><span>这台设备上最后修改</span><strong id="winnerName">—</strong><p id="winnerTime">—</p><div class="warning" id="warning" hidden></div></section><section class="versions"><div class="section-head"><strong>按修改时间</strong><span>新 → 旧</span></div><div id="versionList"></div></section><section class="duplicates" id="duplicates" hidden><div class="section-head"><strong>其实是同一份</strong><span id="duplicateCount">—</span></div><div id="duplicateList"></div></section><small class="note">“最后修改”使用浏览器从当前文件拿到的修改时间；文件被下载、复制或转存后，这个时间可能被系统改写。因此这里会同时比内容，而不是把文件名或时间单独当真。</small></div></section></main><script src="./app.js?v=202608131354"></script></body></html>

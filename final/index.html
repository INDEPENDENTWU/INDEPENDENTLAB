<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f1efe9"><meta name="description" content="终版判定。把同一份文件的几个版本放进来，按修改时间和内容找出最可能的最终版。"><meta property="og:title" content="终版判定"><meta property="og:description" content="把同一份文件的几个版本放进来，按修改时间和内容找最终版。"><title>终版判定</title><link rel="stylesheet" href="./style.css?v=202608131354"><link rel="stylesheet" href="../assets/microcopy.css?v=202608131955"></head><body><main class="shell"><header class="top"><a class="identity" href="../"><span class="mark"><i></i><i></i><b>?</b></span><span>终版判定</span></a></header><section class="intro" id="intro"><div class="hero" aria-hidden="true"><span>FINAL</span><span>final2</span><span>最终版</span><i></i></div><div class="copy"><span class="serial">17</span><h1>终版判定</h1><p>把同一份文件的几个版本放进来，按修改时间和内容找出最可能的最终版。</p></div><button class="pick" id="pick" type="button"><span>选择 2–20 个版本</span><b>↗</b></button><input id="files" type="file" multiple hidden><small>所有文件都能看修改时间和完全重复；PDF、Word、Excel、PowerPoint、TXT 等还能比较正文。</small><p class="error" id="error" hidden></p></section><section class="busy" id="busy" hidden><span>比较版本</span><strong id="busyText">正在打开</strong><i></i></section><section class="result" id="result" hidden><header class="result-top"><button id="back">返回</button><strong>终版判定</strong><button id="again">换一组</button></header><div class="result-body"><section class="verdict"><span>最后修改</span><strong id="winnerName">—</strong><p id="winnerTime">—</p><div class="warning" id="warning" hidden></div></section><section class="versions"><div class="section-head"><strong>按修改时间</strong><span>新 → 旧</span></div><div id="versionList"></div></section><section class="duplicates" id="duplicates" hidden><div class="section-head"><strong>重复内容</strong><span id="duplicateCount">—</span></div><div id="duplicateList"></div></section><small class="note">复制或转存会改修改时间，最终版还要看内容。</small></div>

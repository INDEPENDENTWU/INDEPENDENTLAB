<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ece9e2"><meta name="description" content="冷场计时。只在聊天已经进行、并出现明显长于当前对话节奏的无人说话时计为冷场；普通停顿和环境杂音不算。"><meta property="og:title" content="冷场计时"><meta property="og:description" content="普通停顿不算，真的没人接话才开始计。"><title>冷场计时</title><link rel="stylesheet" href="./style.css?v=202608130348"></head><body><main class="shell" id="home"><header class="top"><a class="identity" href="../" aria-label="回首页"><span class="mark" aria-hidden="true"><i></i><b></b><em></em></span><span>冷场计时</span></a></header><section class="intro"><div class="hero" aria-hidden="true"><span class="talk a"></span><span class="gap"><i></i></span><span class="talk b"></span><strong>…</strong></div><div class="copy"><span class="serial">14</span><h1>冷场计时</h1><p>聊天已经进行后，只有一次无人说话明显长于刚才的正常接话节奏，才开始算冷场。</p></div><button class="start" id="start" type="button"><span>开始听聊天</span><b aria-hidden="true">↗</b></button><small class="note">只在当前设备判断有没有人声，不录音、不转文字。普通环境杂音不会直接算说话；电视、播客或音箱里的人声仍可能被识别成人声。</small><p class="error" id="error" hidden role="alert"></p></section></main><section class="session" id="session" hidden><header class="session-top"><button id="exit" type="button">退出</button><div class="session-title"><strong>冷场计时</strong><span id="micState">正在准备人声识别</span></div><button id="pause" type="button">暂停</button></header><div class="stage"><div class="level" aria-hidden="true"><i id="levelBar"></i></div><div class="center"><span class="state" id="stateText">先聊起来</span><strong class="timer" id="timer">—</strong><p id="hint">听到几轮对话后才开始判断冷场</p><small class="line-note" id="lineNote">正在学习这场聊天的节奏</small></div><div class="calibration" id="calibration"><strong id="calValue">…</strong><span id="calText">正在载入人声识别</span></div></div><footer class="session-bottom"><div class="stats"><div><span>最长冷场</span><strong id="longest">—</strong></div><div><span>冷场</span><strong id="count">0 次</strong></div><div><span>平时停顿</span><strong id="usualGap">—</strong></div></div><div class="tools"><div class="threshold-readout"><span>当前冷场线</span><strong id="thresholdValue">学习中</strong></div><button id="finish" type="button"><span>本次</span><strong>结束</strong></button></div></footer><section class="result" id="result" hidden><div class="result-card"><span>本次最长冷场</span><strong id="resultLongest">—</strong><div><p><b id="resultCount">0</b><small>次冷场</small></p><p><b id="resultUsual">—</b><small>平时停顿</small></p></div><button class="primary" id="share" type="button">分享结果</button><button id="again" type="button">重新开始</button><button id="done" type="button">结束</button></div></section></section><script src="./app.js?v=202608130348"></script></body></html>

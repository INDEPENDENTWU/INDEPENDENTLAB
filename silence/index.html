<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ece9e2"><meta name="description" content="冷场计时。聊天连续没人出声明显超过几秒后自动开始计时，有人出声时结束，并记录本次最长冷场。"><meta property="og:title" content="冷场计时"><meta property="og:description" content="看看这场聊天最长能安静多久。"><title>冷场计时</title><link rel="stylesheet" href="./style.css?v=202608130332"></head><body><main class="shell" id="home"><header class="top"><a class="identity" href="../" aria-label="回首页"><span class="mark" aria-hidden="true"><i></i><b></b><em></em></span><span>冷场计时</span></a></header><section class="intro"><div class="hero" aria-hidden="true"><span class="talk a"></span><span class="gap"><i></i></span><span class="talk b"></span><strong>…</strong></div><div class="copy"><span class="serial">14</span><h1>冷场计时</h1><p>聊天连续没人出声明显超过几秒后自动开始计时；有人出声就结束，并记录本次最长冷场。</p></div><button class="start" id="start" type="button"><span>开始计冷场</span><b aria-hidden="true">↗</b></button><small class="note">只判断当前房间有没有明显声音，不录音、不转文字。适合饭桌、约会、聚会和任何突然没人讲话的时刻。</small><p class="error" id="error" hidden role="alert"></p></section></main><section class="session" id="session" hidden><header class="session-top"><button id="exit" type="button">退出</button><div class="session-title"><strong>冷场计时</strong><span id="micState">正在听</span></div><button id="pause" type="button">暂停</button></header><div class="stage"><div class="level" aria-hidden="true"><i id="levelBar"></i></div><div class="center"><span class="state" id="stateText">有人出声</span><strong class="timer" id="timer">—</strong><p id="hint">最后一个声音结束后开始计算</p></div><div class="calibration" id="calibration"><strong id="calValue">1.5</strong><span>先安静一下</span></div></div><footer class="session-bottom"><div class="stats"><div><span>最长</span><strong id="longest">—</strong></div><div><span>冷场</span><strong id="count">0 次</strong></div><div><span>累计</span><strong id="totalCold">—</strong></div></div><div class="tools"><button id="threshold" type="button"><span>多久算冷场</span><strong id="thresholdValue">3 秒</strong></button><button id="finish" type="button"><span>本次</span><strong>结束</strong></button></div></footer><section class="result" id="result" hidden><div class="result-card"><span>本次最长冷场</span><strong id="resultLongest">00:00.0</strong><div><p><b id="resultCount">0</b><small>次冷场</small></p><p><b id="resultTotal">00:00.0</b><small>累计</small></p></div><button class="primary" id="share" type="button">分享结果</button><button id="again" type="button">重新开始</button><button id="done" type="button">结束</button></div></section></section><script src="./app.js?v=202608130332"></script></body></html>

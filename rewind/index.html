<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#efede6"><meta name="description" content="刚才录音。开始后持续保留最近一段声音，事情发生后再保存刚才那一段。"><meta property="og:title" content="刚才录音"><meta property="og:description" content="持续保留最近一段声音，事情发生后再保存刚才那一段。"><title>刚才录音</title><link rel="stylesheet" href="./style.css?v=202608121316"><link rel="stylesheet" href="../assets/microcopy.css?v=202608131955"></head><body><main class="shell" id="home"><header class="top"><a class="identity" href="../" aria-label="回首页"><span class="mark" aria-hidden="true"><i></i><b></b><em></em></span><span>刚才录音</span></a></header><section class="intro"><div class="hero" aria-hidden="true"><i class="past"></i><i class="now"></i><b>30</b></div><div class="copy"><span class="serial">10</span><h1>刚才录音</h1><p>开始后持续保留最近一段声音，事情发生后再保存刚才那一段。</p></div><button class="start" id="start" type="button"><span>开始保留声音</span><b aria-hidden="true">↗</b></button><small class="privacy">退出后清除没有保存的声音。</small><p class="error" id="error" hidden role="alert"></p></section></main><section class="listen" id="listen" hidden><header class="listen-top"><button id="exit" type="button">退出</button><div class="listen-status"><strong id="statusTitle">正在保留</strong><span id="statusSub">最近 30 秒</span></div><button id="pauseBtn" type="button">暂停</button></header><div class="memory"><canvas id="wave" width="900" height="300" aria-hidden="true"></canvas><div class="memory-axis" aria-hidden="true"><i></i><b></b></div><div class="retained"><span>已经保留</span><strong id="retainedValue">0.0 秒</strong><small id="eventHint" hidden>突发声</small></div><div class="tail" id="tail" hidden><strong id="tailValue">3.0</strong><span>再收一点尾音</span></div></div><footer class="listen-bottom" id="liveControls"><div class="live-tools"><button id="windowBtn" type="button"><span>时长</span><strong id="windowValue">30 秒</strong></button><button id="modeBtn" type="button"><span>声音</span><strong id="modeValue">人声</strong></button></div><button class="keep" id="keep" type="button" disabled><span id="keepLabel">留住刚才 30 秒</span><small>按下后再收 3 秒，把结尾一起留下。</small><b aria-hidden="true">↗</b></button><p>保持此页打开；切到后台或锁屏后可能暂停麦克风。</p></footer><section class="clip" id="clip" hidden><header><div><span>刚才已经留下</span><strong id="clipDuration">—</strong></div><button id="backLive" type="button">继续保留</button></header><audio id="player" controls preload="metadata"></audio><div class="clip-actions"><button class="save-clip" id="save" type="button"><span id="saveLabel">保存录音</span><b>↗</b></button><button class="delete-clip" id="deleteClip" type="button">删除这段</button></div><small>WAV · 单声道</small></section></section><script src="./app.js?v=202608121316"></script></body></html>

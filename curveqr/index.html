<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f2ed"><meta name="description" content="弯码试扫。把准备印刷的二维码放进来，填码宽和瓶径，直接试一遍贴到圆瓶后还能不能扫。"><title>弯码试扫</title><link rel="stylesheet" href="../assets/foundation.css?v=20260814"><link rel="stylesheet" href="../assets/microcopy.css?v=20260814"><link rel="stylesheet" href="./style.css?v=20260814"></head><body><main class="shell"><header class="top"><a class="identity" href="../" aria-label="回首页"><span class="mark" aria-hidden="true"><i></i><b></b></span><strong>弯码试扫</strong></a><span class="serial">24</span></header><section class="intro"><div class="hero" aria-hidden="true"><svg viewBox="0 0 300 160"><path class="body" d="M55 30c-25 22-25 78 0 100 47 18 143 18 190 0 25-22 25-78 0-100-47-18-143-18-190 0Z"/><path class="grid" d="M109 43v74M131 39v82M153 37v86M175 38v84M197 42v76M96 59h116M91 80h126M96 101h116"/><path class="arc" d="M78 124c43 17 101 20 144 4"/></svg></div><div class="copy"><span class="serial">24</span><h1>弯码试扫</h1><p>把准备印刷的二维码放进来，填码宽和瓶径，直接试一遍贴到圆瓶后还能不能扫。</p></div></section><section class="work"><label class="pick" id="pick"><input id="file" type="file" accept="image/*"><span id="pickTitle">选二维码图片</span><small id="pickNote">用平面的二维码原图，不用拍已经贴到瓶上的实物。</small></label><div class="setup" id="setup" hidden><div class="source"><canvas id="source"></canvas><div><strong id="sourceState">二维码已读出</strong><small id="sourceMeta">平面原图可以正常扫码</small></div><button id="change" type="button">换一张</button></div><div class="numbers"><label><span>码宽</span><div><input id="codeWidth" inputmode="decimal" type="number" min="6" max="160" step="0.5" value="28"><b>mm</b></div><small>含四周白边</small></label><label><span>瓶径</span><div><input id="diameter" inputmode="decimal" type="number" min="8" max="500" step="0.5" value="40"><b>mm</b></div><small id="circumference">周长 125.7 mm</small></label></div><p class="error" id="error" hidden></p></div></section><section class="testing" id="testing" hidden><span>正在弯码试扫</span><i></i></section><section class="result" id="result" hidden><div class="verdict"><span>结果</span><h2 id="verdict">—</h2><p id="summary">—</p></div><div class="simulation"><canvas id="sim"></canvas><div class="sim-caption"><span id="simAngle">正面</span><strong id="simState">—</strong></div></div><div class="facts"><div><span>弯过角度</span><strong id="wrap">—</strong></div><div><span>试扫角度</span><strong id="angles">—</strong></div><div id="recommendRow" hidden><span>建议码宽</span><strong id="recommend">—</strong></div></div><small class="result-note">这里只测试二维码被瓶身弯曲后的影响。实物反光、印刷清晰度和相机也会影响扫码。</small></section></main><canvas id="workCanvas" hidden></canvas><script src="./decoder.js?v=20260814"></script><script src="./sim.js?v=20260814"></script><script src="./app.js?v=202608150316"></script></body></html>

<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ece9e1"><meta name="description" content="照片量尺。把银行卡尺寸的卡片或 A4 纸和物品拍在同一平面，自动贴合参考外框后测量照片中的实际尺寸。"><meta property="og:title" content="照片量尺"><meta property="og:description" content="用标准尺寸参考物自动校准照片透视，直接测量照片里的实际尺寸。"><title>照片量尺</title><link rel="stylesheet" href="./style.css?v=202608120351"><link rel="stylesheet" href="./precision.css?v=202608120351"></head><body><main class="measure-shell"><header class="top"><a class="identity" href="../" aria-label="回首页"><span class="mini-ruler" aria-hidden="true"><i></i><b></b></span><span>照片量尺</span></a><button class="quiet" id="resetAll" type="button" hidden>返回</button></header><section class="intro" id="intro"><div class="hero" aria-hidden="true"><i class="card"></i><i class="dimension"></i><b></b><em></em></div><div class="intro-copy"><span class="serial">08</span><h1>照片量尺</h1><p>把标准尺寸的卡片或 A4 纸和物品拍在同一平面，自动贴合参考外框后测量照片里的实际尺寸。</p></div><div class="reference-choice" role="group" aria-label="参考物"><button class="active" type="button" data-ref="card"><span>银行卡尺寸</span><small>85.60 × 53.98 mm</small></button><button type="button" data-ref="a4"><span>A4 纸</span><small>297 × 210 mm</small></button></div><div class="pickers"><label class="take"><input id="cameraInput" type="file" accept="image/*" capture="environment"><span>拍一张</span><b>↗</b></label><label class="choose"><input id="fileInput" type="file" accept="image/*"><span>选照片</span></label></div><small class="local-note">参考物和被测物需要放在同一平面。照片只在当前设备处理。</small><p class="error" id="introError" hidden></p></section><section class="work" id="work" hidden><div class="work-head"><div><span id="stepLabel">校准参考</span><strong id="stepTitle">正在找参考物</strong><small id="stepMeta"></small></div><div class="work-actions"><button id="rotateRef" type="button" hidden>旋转参考</button><button id="recalibrate" type="button" hidden>重标参考</button><button id="undo" type="button" disabled>撤销上一步</button></div></div><div class="stage-wrap"><div class="photo-stage" id="photoStage"><img id="photo" alt="待测照片"><svg class="vector-layer" id="vectorLayer" aria-hidden="true"><polygon id="referencePolygon"></polygon><g id="measurementLines"></g></svg><div class="marker-layer" id="markerLayer"></div><div class="label-layer" id="labelLayer"></div></div></div><div class="readout" id="readout"><div><span id="readoutLabel">参考尚未校准</span><strong id="readoutValue">—</strong><small id="readoutSub">先让参考物外框完成校准。</small></div><button class="save" id="save" type="button" disabled><span id="saveLabel">保存标注图</span><b>↗</b></button></div><p class="work-note" id="workNote">会先自动寻找参考物外框；找不到时再手动粗略点四角。</p></section></main><script src="./app.js?v=202608120351"></script><script src="./precision.js?v=202608120351"></script></body></html>

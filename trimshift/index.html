<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f2ed"><meta name="description" content="上传成稿，按成品尺寸、圆角和裁切公差直接预演最坏偏刀。"><title>这一刀偏了会怎样</title><link rel="stylesheet" href="../assets/foundation.css?v=20260814"><link rel="stylesheet" href="../assets/microcopy.css?v=20260814"><link rel="stylesheet" href="./style.css?v=20260814"></head><body><main class="shell home" id="home"><header class="top"><a class="identity" href="../" aria-label="回首页"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><b></b></span><strong>这一刀偏了会怎样</strong></a><span class="serial">25</span></header><section class="intro"><div class="hero" aria-hidden="true"><i></i><i></i><i></i><i></i><b></b></div><div class="copy"><span class="serial">25</span><h1>这一刀偏了会怎样</h1><p>把成稿放进来，直接看裁切往四个方向偏满以后，成品会变成什么样。</p></div><label class="pick" id="pick"><input id="file" type="file" accept="image/*,.pdf,application/pdf"><span>放进成稿</span><b aria-hidden="true">↗</b><small>PNG、JPG、WebP、SVG 或 PDF</small></label><p id="error" class="error" hidden></p></section></main><section class="workspace shell" id="workspace" hidden><header class="work-head"><div><span class="serial">25</span><strong id="fileName">成稿</strong></div><button id="change" type="button">换一个</button></header><div class="setup"><div class="source-wrap"><canvas id="source"></canvas><span id="sourceMeta">—</span></div><div class="controls"><div class="preset" role="group" aria-label="常用尺寸"><button data-size="85,55" type="button">85 × 55</button><button data-size="90,54" type="button">90 × 54</button><button data-size="55,85" type="button">55 × 85</button><button data-size="63,88" type="button">63 × 88</button></div><div class="fields"><label><span>成品</span><span class="pair"><input id="trimW" inputmode="decimal" value="85" aria-label="成品宽"><b>×</b><input id="trimH" inputmode="decimal" value="55" aria-label="成品高"><em>mm</em></span></label><label><span>出血</span><span class="single"><input id="bleed" inputmode="decimal" value="3"><em>mm</em></span></label><label><span>偏刀</span><span class="single"><input id="tolerance" inputmode="decimal" value="1"><em>± mm</em></span></label><label><span>圆角</span><span class="single"><input id="radius" inputmode="decimal" value="3"><em>R mm</em></span></label></div><div class="page-row" id="pageRow" hidden><span>PDF 页</span><select id="pageSelect"></select></div></div></div><section class="result" id="result"><div class="result-head"><span>结果</span><h2 id="verdict">—</h2><p id="summary">—</p></div><div class="scenario" role="group" aria-label="偏刀方向"><button data-dir="-1,-1" type="button">↖</button><button data-dir="1,-1" type="button">↗</button><button data-dir="0,0" class="active" type="button">正</button><button data-dir="-1,1" type="button">↙</button><button data-dir="1,1" type="button">↘</button></div><div class="proof"><canvas id="proof"></canvas><span id="proofLabel">理想刀位</span></div><div class="facts"><div><span>几何最低出血</span><strong id="minBleed">—</strong></div><div><span>对称边框最坏差</span><strong id="borderDiff">—</strong></div><div><span>直边保证跨度</span><strong id="safeSize">—</strong></div></div><div class="map"><div class="map-head"><strong>所有刀位叠在一起</strong><span>深色区始终保留，橙色带会因偏刀变化。</span></div><canvas id="risk"></canvas></div><button class="export" id="exportBtn" type="button">保存四刀对照图</button><small class="note">这是裁切几何预演，不代替印厂自己的出血、套准和刀模规范。</small></section></section><canvas id="work" hidden></canvas><script src="./geometry.js?v=20260814"></script><script src="./app.js?v=20260814"></script></body></html>

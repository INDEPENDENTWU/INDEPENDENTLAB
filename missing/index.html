<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f1efe9"><meta name="description" content="谁没交。选一份现成名单或直接粘贴，以后只选收到的文件或 ZIP，直接看谁没交。"><meta property="og:title" content="谁没交"><meta property="og:description" content="名单选文件或直接粘贴；文件名不清楚时还会在本机看文件里的姓名或学号。"><title>谁没交</title><link rel="stylesheet" href="./style.css?v=202608131505"><link rel="stylesheet" href="./v3.css?v=202608131505"></head><body><main class="shell"><header class="top"><a class="identity" href="../" aria-label="回首页"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><b></b></span><span>谁没交</span></a></header><section class="intro" id="intro"><div class="hero" aria-hidden="true"><span></span><i></i><i></i><i></i><b></b></div><div class="copy"><span class="serial">16</span><h1>谁没交</h1><p>名单选现成文件，或者直接粘贴。以后每次只选收到的文件或 ZIP，直接看谁没交、谁交了多份。</p></div><section class="roster-file" id="rosterState"><div><span>名单</span><strong id="rosterName">还没有名单</strong><small id="rosterCount">支持 Excel、CSV、TXT、PDF、DOCX，也可直接粘贴</small></div><button id="pickRoster" type="button">选择名单</button><input id="rosterFile" type="file" accept=".xlsx,.csv,.tsv,.txt,.pdf,.docx" hidden></section><button class="pick" id="pickBatch" type="button" disabled><span>选择收到的文件 / ZIP</span><b aria-hidden="true">↗</b></button><input id="batchFiles" type="file" multiple hidden><p class="busy" id="busy" hidden>正在看文件名</p><p class="error" id="error" hidden role="alert"></p><small class="privacy">先看文件名；认不出时，只在当前设备读取 PDF / Word / Excel / 文本里的少量文字找姓名或学号。不上传文件。</small></section></main><section class="result" id="result" hidden><header class="result-top"><button id="back" type="button">返回</button><div><strong>谁没交</strong><span id="batchMeta">—</span></div><button id="again" type="button">换一批</button></header><div class="result-body"><section class="summary"><span>这批文件</span><strong><b id="submitted">0</b><i>/</i><em id="total">0</em></strong><p id="summaryText">—</p></section><section class="ledger missing" id="missingBlock"><div class="ledger-head"><strong>没交</strong><span id="missingCount">0 人</span></div><div id="missingList"></div></section><section class="ledger" id="duplicateBlock" hidden><div class="ledger-head"><strong>交了多份</strong><span id="duplicateCount">0 人</span></div><div id="duplicateList"></div></section><section class="ledger" id="unmatchedBlock" hidden><div class="ledger-head"><strong>还没认出</strong><span id="unmatchedCount">0 个</span></div><div id="unmatchedList"></div></section><div class="result-actions"><button id="copyMissing" type="button">复制没交名单</button><button id="changeRoster" type="button">换名单</button></div><small class="result-note">名字或学号能唯一对应才会自动算。拿不准就留在“还没认出”，不硬猜。</small></div></section><script src="./app.js?v=202608131505"></script><script src="./v3.js?v=202608131505"></script></body></html>

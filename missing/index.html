<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f1efe9"><meta name="description" content="谁没交。名单记一次，以后只选收到的文件，直接看谁没交、谁交了多份、哪些文件名没认出来。"><meta property="og:title" content="谁没交"><meta property="og:description" content="几十份文件收完，不用再一个个对名字。"><title>谁没交</title><link rel="stylesheet" href="./style.css?v=202608131309"></head><body><main class="shell"><header class="top"><a class="identity" href="../" aria-label="回首页"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><b></b></span><span>谁没交</span></a></header><section class="intro" id="intro"><div class="hero" aria-hidden="true"><span></span><i></i><i></i><i></i><b></b></div><div class="copy"><span class="serial">16</span><h1>谁没交</h1><p>第一次把名单贴进来。以后每次只选收到的那批文件，直接看谁没交、谁交了多份、哪些文件名没认出来。</p></div><section class="roster" id="rosterBlock"><div class="roster-head"><div><strong>名单</strong><span id="rosterCount">还没记名单</span></div><button id="editRoster" type="button" hidden>修改</button></div><div class="roster-edit" id="rosterEdit"><textarea id="rosterText" placeholder="每人一行。姓名前后带学号也可以。&#10;&#10;2026001 张三&#10;2026002 李四&#10;2026003 王五"></textarea><small>会记在当前浏览器里。复制 Excel 一列或“学号 + 姓名”都可以。</small></div></section><button class="pick" id="pick" type="button"><span>选择收到的文件</span><b aria-hidden="true">↗</b></button><input id="files" type="file" multiple hidden><p class="error" id="error" hidden role="alert"></p><small class="privacy">只读取文件名，不读取文件内容，也不上传。</small></section></main><section class="result" id="result" hidden><header class="result-top"><button id="back" type="button">返回</button><div><strong>谁没交</strong><span id="batchMeta">—</span></div><button id="again" type="button">换一批</button></header><div class="result-body"><section class="summary"><span>这批文件</span><strong><b id="submitted">0</b><i>/</i><em id="total">0</em></strong><p id="summaryText">—</p></section><section class="ledger missing" id="missingBlock"><div class="ledger-head"><strong>没交</strong><span id="missingCount">0 人</span></div><div id="missingList"></div></section><section class="ledger" id="duplicateBlock" hidden><div class="ledger-head"><strong>交了多份</strong><span id="duplicateCount">0 人</span></div><div id="duplicateList"></div></section><section class="ledger" id="unmatchedBlock" hidden><div class="ledger-head"><strong>没认出文件名</strong><span id="unmatchedCount">0 个</span></div><div id="unmatchedList"></div></section><div class="result-actions"><button id="copyMissing" type="button">复制没交名单</button><button id="changeRoster" type="button">改名单</button></div><small class="result-note">名字或学号明确出现在文件名里才自动认。拿不准的不会硬算，手动归一次即可更新结果。</small></div></section><script src="./app.js?v=202608131309"></script></body></html>

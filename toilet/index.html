<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11120f"><meta name="description" content="如厕时限。人没走，表不停。"><meta property="og:title" content="如厕时限"><meta property="og:description" content="人没走，表不停。"><title>如厕时限</title><link rel="stylesheet" href="./style.css"></head><body><main class="clock-shell" id="clockShell"><header class="top"><div class="identity"><div class="identity-line"><a class="name" href="../">如厕时限</a><span class="seatmark" aria-hidden="true"><svg class="toilet-glyph" viewBox="0 0 18 18"><path d="M3 2.5h6v4H3z"/><path d="M3 6.5h10.5v1c0 3.8-2.2 6-5.25 6S3 11.3 3 7.5z"/><path d="M8.25 13.5v2M5.4 15.5h5.7"/></svg><span>坐 <b>→</b> 撤</span></span></div><p class="motto">人没走，表不停。</p></div><button class="reset" id="reset" type="button">重来</button></header><section class="face-wrap"><div class="face" id="face"><div class="exit-tab" aria-hidden="true">撤</div><div class="sweep" aria-hidden="true"></div><div class="face-inner"><p class="status" id="status">还能坐多久？</p><div class="time"><span id="timeMain">00:00</span><span class="fraction" id="timeFraction">.0000</span></div><p class="remain" id="remain">坐下就开始。</p><p class="limit" id="limit">撤离线 --:--</p></div></div></section><section class="conditions" aria-label="本次情况"><div class="condition"><span>今天</span><strong id="tripValue">第 1 趟</strong></div><div class="condition"><span>本次额度</span><strong id="quotaValue">--:--</strong></div><div class="condition"><span>当前</span><strong id="stateValue">合理失联</strong></div></section><button class="main-action" id="action" type="button"><span id="actionLabel">坐下</span><span class="action-mark" aria-hidden="true">↗</span></button><p class="after" id="after" aria-live="polite"></p></main><script src="./app.js"></script></body></html>

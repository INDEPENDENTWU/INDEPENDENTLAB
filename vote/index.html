<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#efeee8"><meta name="description" content="现场表决。所有人同时举一只手，拍一张，直接统计赞成、反对和保留。"><meta property="og:title" content="现场表决"><meta property="og:description" content="所有人同时举一只手，拍一张，直接统计赞成、反对和保留。"><title>现场表决</title><link rel="stylesheet" href="./style.css?v=202608131657"><link rel="stylesheet" href="../assets/microcopy.css?v=202608131955"></head><body><main class="shell"><header class="top"><a class="identity" href="../" aria-label="回首页"><span class="mark" aria-hidden="true"><i></i><b></b><em></em></span><span>现场表决</span></a></header><section class="intro" id="intro"><div class="hero" aria-hidden="true"><span class="yes">↑</span><span class="hold">│</span><span class="no">↓</span><i></i></div><div class="copy"><span class="serial">18</span><h1>现场表决</h1><p>所有人同时举一只手。👍 赞成，👎 反对，✋ 保留。拍一张，直接数票。</p></div><div class="actions"><button id="take" type="button"><span>拍一下</span><b>↗</b></button><button id="choose" type="button"><span>选照片</span><b>＋</b></button></div><input id="cameraInput" type="file" accept="image/*" capture="environment" hidden><input id="photoInput" type="file" accept="image/*" hidden><small>手尽量完整露出来、彼此别重叠；太小、遮挡或姿势不清的手会留作未识别。</small><p class="error" id="error" hidden role="alert"></p></section><section class="busy" id="busy" hidden><span>正在数</span><strong id="busyText">先找手</strong><i></i></section><section class="result" id="result" hidden><header class="result-top"><button id="back" type="button">返回</button><strong>现场表决</strong><button id="again" type="button">再拍</button></header><div class="result-body"><section class="score"><div class="score-main"><span>赞成</span><strong id="yesCount">0</strong></div><div><span>反对</span><strong id="noCount">0</strong></div><div><span>保留</span><strong id="holdCount">0</strong></div></section><p class="verdict" id="verdict">—</p><div class="photo"><ca

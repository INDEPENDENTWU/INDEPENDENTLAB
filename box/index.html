<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#efece5"><meta name="description" content="纸箱降高。把东西先放进纸箱，只量顶部还空多少厘米，直接得到新折线和四角切口位置。"><meta property="og:title" content="纸箱降高"><meta property="og:description" content="纸箱太高，只量一个数就知道从哪里压线、剪到哪里。"><title>纸箱降高</title><link rel="stylesheet" href="./simple.css?v=202608131147"></head><body><main class="shell"><header class="top"><a class="identity" href="../" aria-label="回首页"><span class="mark" aria-hidden="true"><i></i><b></b><em></em></span><span>纸箱降高</span></a></header><section class="intro" id="intro"><div class="hero" aria-hidden="true"><span class="box"></span><i></i><b></b><em></em></div><div class="copy"><span class="serial">15</span><h1>纸箱降高</h1><p>东西已经能放进箱子，只是上面空太多时：把东西先放进去，只量顶部还空多少厘米。</p></div><form class="form" id="form"><label class="one-input"><span>物品上方还空</span><div><input id="gap" inputmode="decimal" placeholder="8" autocomplete="off"><b>cm</b></div></label><div class="keep"><span>顶部默认留 1 cm 缓冲</span><div id="keep"><button type="button" data-v="0">不留</button><button class="active" type="button" data-v="1">1 cm</button><button type="button" data-v="2">2 cm</button></div></div><button class="start" type="submit"><span>看从哪里折</span><b aria-hidden="true">↗</b></button><small>适合常见上下四片盖的瓦楞纸箱，而且长宽本来就能装下物品。只改高度，不重做纸箱结构。</small><p class="error" id="error" hidden></p></form></section><section class="result" id="result" hidden><header class="result-top"><button id="back" type="button">返回</button><div><strong>纸箱降高</strong><span>只改高度</span></div><button id="reset" type="button">重填</button></header><div class="result-body"><section class="verdict"><span id="verdictLabel">从原顶折线往下</span><strong id="drop">—</strong><p id="verdictText">—</p></section><section class="diagram"><div class="box3d" aria-hidden="true"><span class="front"></span><span class="side"></span><span class="top"></span><i id="scoreLine"></i></div><div class="diagram-note"><strong id="cutDepth">—</strong><span>四个角都剪到这里</span></div></section><ol class="steps" id="steps"></ol><small class="safety">先压新折线，再剪四条竖角。刀片朝远离身体的方向。重物、贵重或易碎物品应优先使用尺寸合适且结构完整的纸箱。</small></div></section></main><script src="./simple.js?v=202608131147"></script></body></html>

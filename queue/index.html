<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eee9df"><meta name="description" content="排队估时。输入自己的号码和当前叫到的号码，再更新一次当前号码，根据实际叫号速度估算还要等多久。"><meta property="og:title" content="排队估时"><meta property="og:description" content="根据现场实际叫号速度估算还要等多久。"><title>排队估时</title><link rel="stylesheet" href="./style.css?v=202608120146"></head><body><main class="queue-shell"><header class="top"><a class="identity" href="../" aria-label="回首页"><span class="mini-ticket" aria-hidden="true"><i></i><b></b></span><span>排队估时</span></a><button class="quiet" id="finish" type="button" hidden>结束</button></header><section class="intro" id="intro"><div class="hero-ticket" aria-hidden="true"><span>07</span><i></i><b></b></div><div class="intro-copy"><span class="serial">07</span><h1>排队估时</h1><p>输入自己的号码和当前叫到的号码，再更新一次当前号码，根据实际叫号速度估算还要等多久。</p></div><form class="setup" id="setup"><label><span>我的号</span><input id="mine" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="68" aria-label="我的号码"></label><label><span>现在到</span><input id="current" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="51" aria-label="当前号码"></label><button id="start" type="submit" disabled><span>开始等</span><b aria-hidden="true">↗</b></button></form><p class="setup-error" id="setupError" hidden></p></section><section class="waiting" id="waiting" hidden aria-live="polite"><div class="ticket-head"><div class="number-pair"><div><span>我的号</span><strong id="mineView">—</strong></div><i aria-hidden="true"></i><div><span>现在到</span><strong id="currentView">—</strong></div></div><span class="live-dot" aria-hidden="true"></span></div><div class="estimate"><p id="primaryLabel">前面还有</p><div class="remaining"><strong id="remaining">—</strong><span id="remainingUnit">个</span></div><div class="eta" id="eta"><strong id="etaMain">更新一次当前号后开始估时</strong><span id="etaClock"></span></div></div><div class="pace" id="pace"><div><span>已经等了</span><strong id="elapsed">00:00</strong></div><div><span>最近速度</span><strong id="speed">—</strong></div><div><span>已观察</span><strong id="observed">0 个号</strong></div></div><form class="update" id="updateForm"><label for="updateCurrent">现在叫到</label><div class="update-row"><input id="updateCurrent" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="更新当前号码"><button type="submit"><span>更新</span><b aria-hidden="true">↗</b></button></div><p id="updateHint">过一会看一眼叫号屏，填入新的当前号码。</p></form><p class="update-error" id="updateError" hidden></p></section></main><script src="./app.js?v=202608120146"></script></body></html>

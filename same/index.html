<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f1efe7"><meta name="description" content="同角度拍。选择一张参考照片，将它叠加在实时相机画面上，用于重新拍摄相同角度和构图。"><meta property="og:title" content="同角度拍"><meta property="og:description" content="选择一张参考照片，将它叠加在实时相机画面上，用于重新拍摄相同角度和构图。"><title>同角度拍</title><link rel="stylesheet" href="./style.css?v=202608120334"><link rel="stylesheet" href="./refine.css?v=202608120334"></head><body><main class="same-shell"><header class="top"><a class="identity" href="../" aria-label="回首页"><span class="mini-frame" aria-hidden="true"><i></i><b></b></span><span>同角度拍</span></a></header><section class="intro" id="intro"><div class="hero-mark" aria-hidden="true"><i class="old"></i><i class="new"></i><b></b></div><div class="intro-copy"><span class="serial">07</span><h1>同角度拍</h1><p>选择一张参考照片，将它叠加在实时相机画面上，用于重新拍摄相同角度和构图。</p></div><label class="picker"><input id="referenceInput" type="file" accept="image/*"><span>选参考照片</span><b aria-hidden="true">↗</b></label><div class="saved-reference" id="savedReference" hidden><button id="useSavedRef" type="button"><span>使用常用参考</span><small>这台设备保存的照片</small></button><button id="forgetSavedRef" type="button">清除</button></div><small class="local-note">照片只在当前设备处理。</small><p class="error" id="error" hidden role="alert"></p></section></main><section class="camera" id="camera" hidden><div class="camera-top"><button id="closeCamera" type="button">取消</button><strong>同角度拍</strong><button id="flipCamera" type="button">翻转</button></div><div class="camera-work"><div class="capture-frame" id="captureFrame"><video id="video" playsinline muted></video><img id="referenceOverlay" alt="参考照片"><canvas class="reference-outline" id="referenceOutline" aria-hidden="true"></canvas><div class="frame-edge" aria-hidden="true"><i></i><i></i><i></i><i></i></div><strong class="countdown" id="countdown" hidden>3</strong></div><p class="hold-hint">按住画面暂时隐藏参考照片。</p></div><div class="camera-controls"><div class="reference-tools"><button class="opacity" id="referenceBtn" type="button"><span>参考</span><strong id="referenceModeValue">45%</strong></button><button class="mirror-ref" id="mirrorRefBtn" type="button" aria-pressed="false"><span>镜像</span><strong id="mirrorRefValue">关</strong></button></div><button class="shutter" id="shutter" type="button" aria-label="拍照"><i></i></button><div class="camera-tools"><button class="zoom" id="zoomBtn" type="button" hidden><span>焦距</span><strong id="zoomValue">1×</strong></button><button class="timer" id="timerBtn" type="button" aria-pressed="false"><span>延时</span><strong id="timerValue">关</strong></button></div></div></section><section class="review" id="review" hidden><header class="review-top"><button id="exitReview" type="button">返回</button><strong>对齐检查</strong><button id="retake" type="button">重拍</button></header><main class="review-body"><div class="compare" id="compare"><img class="before" id="beforeImage" alt="参考照片"><div class="after-wrap" id="afterWrap"><img class="after" id="afterImage" alt="新拍照片"></div><i class="divider" id="divider" aria-hidden="true"><b></b></i><input id="compareSlider" type="range" min="0" max="100" value="50" aria-label="前后照片对比位置"><span class="before-label">参考</span><span class="after-label">新拍</span></div><div class="review-tools"><p class="review-copy">拖动分界线检查主体位置和构图是否对齐。</p><button class="blink" id="blinkBtn" type="button" aria-pressed="false">闪看</button><button class="change-reference" id="changeReference" type="button">换参考图</button></div><button class="remember" id="rememberRef" type="button">保存为常用参考</button></main><footer class="review-actions"><button class="save" id="savePhoto" type="button"><span id="saveLabel">保存新照片</span><b aria-hidden="true">↗</b></button><button class="save-compare" id="saveCompare" type="button"><span id="saveCompareLabel">保存对比图</span></button></footer></section><canvas id="captureCanvas" hidden></canvas><script src="./app.js?v=202608120334"></script><script src="./precision.js?v=202608120334"></script></body></html>

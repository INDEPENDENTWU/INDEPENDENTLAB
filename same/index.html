<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f1efe7"><meta name="description" content="同角度拍。选择一张参考照片，将它半透明叠加在实时相机画面上，用于重新拍摄相同角度和构图。"><meta property="og:title" content="同角度拍"><meta property="og:description" content="选择一张参考照片，将它半透明叠加在实时相机画面上，用于重新拍摄相同角度和构图。"><title>同角度拍</title><link rel="stylesheet" href="./style.css?v=202608120208"></head><body><main class="same-shell"><header class="top"><a class="identity" href="../" aria-label="回首页"><span class="mini-frame" aria-hidden="true"><i></i><b></b></span><span>同角度拍</span></a></header><section class="intro" id="intro"><div class="hero-mark" aria-hidden="true"><i class="old"></i><i class="new"></i><b></b></div><div class="intro-copy"><span class="serial">07</span><h1>同角度拍</h1><p>选择一张参考照片，将它半透明叠加在实时相机画面上，用于重新拍摄相同角度和构图。</p></div><label class="picker"><input id="referenceInput" type="file" accept="image/*"><span>选参考照片</span><b aria-hidden="true">↗</b></label><small class="local-note">照片只在当前设备处理。</small><p class="error" id="error" hidden role="alert"></p></section></main><section class="camera" id="camera" hidden><div class="camera-top"><button id="closeCamera" type="button">取消</button><strong>同角度拍</strong><button id="flipCamera" type="button">翻转</button></div><div class="camera-work"><div class="capture-frame" id="captureFrame"><video id="video" playsinline muted></video><img id="referenceOverlay" alt="参考照片"><div class="frame-edge" aria-hidden="true"><i></i><i></i><i></i><i></i></div></div><p class="hold-hint">按住画面暂时隐藏参考照片。</p></div><div class="camera-controls"><button class="opacity" id="opacityBtn" type="button"><span>参考</span><strong id="opacityValue">45%</strong></button><button class="shutter" id="shutter" type="button" aria-label="拍照"><i></i></button><span class="spacer" aria-hidden="true"></span></div></section><section class="review" id="review" hidden><header class="review-top"><button id="retake" type="button">重拍</button><strong>对齐检查</strong><button id="changeReference" type="button">换参考图</button></header><main class="review-body"><div class="compare" id="compare"><img class="before" id="beforeImage" alt="参考照片"><div class="after-wrap" id="afterWrap"><img class="after" id="afterImage" alt="新拍照片"></div><i class="divider" id="divider" aria-hidden="true"><b></b></i><input id="compareSlider" type="range" min="0" max="100" value="50" aria-label="前后照片对比位置"><span class="before-label">参考</span><span class="after-label">新拍</span></div><p class="review-copy">拖动分界线检查主体位置和构图是否对齐。</p></main><footer class="review-actions"><button class="save" id="savePhoto" type="button"><span id="saveLabel">保存照片</span><b aria-hidden="true">↗</b></button></footer></section><canvas id="captureCanvas" hidden></canvas><script src="./app.js?v=202608120208"></script></body></html>

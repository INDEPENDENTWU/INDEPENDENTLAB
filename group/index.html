<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eeece6"><meta name="description" content="合照挑一张。选择几张连续合照，优先找出人数完整、没人明显闭眼、脸最清楚的一张。"><meta property="og:title" content="合照挑一张"><meta property="og:description" content="几张差不多的合照，到底留哪张。"><title>合照挑一张</title><link rel="stylesheet" href="./style.css?v=202608131354"></head><body><main class="shell"><header class="top"><a class="identity" href="../"><span class="mark"><i></i><i></i><b></b></span><span>合照挑一张</span></a></header><section class="intro" id="intro"><div class="hero" aria-hidden="true"><i></i><i></i><i></i><b></b><em></em></div><div class="copy"><span class="serial">17</span><h1>合照挑一张</h1><p>选几张连续合照。优先找出人数完整、没人明显闭眼，而且脸更清楚的一张。</p></div><button class="pick" id="pick" type="button"><span>选择 2–20 张照片</span><b>↗</b></button><input id="files" type="file" accept="image/*" multiple hidden><small>照片只在当前设备分析。不会自动删除，也不会改原图。</small><p class="error" id="error" hidden></p></section><section class="busy" id="busy" hidden><span>正在挑</span><strong id="busyText">正在看照片</strong><i></i></section><section class="result" id="result" hidden><header class="result-top"><button id="back">返回</button><strong>合照挑一张</strong><button id="again">换一组</button></header><div class="result-body"><section class="winner"><span>建议留这张</span><div class="winner-photo"><img id="winnerImg" alt="建议照片"></div><strong id="winnerName">—</strong><p id="winnerMeta">—</p></section><section class="all"><div class="all-head"><strong>这组照片</strong><span>按建议顺序</span></div><div id="list"></div></section><button class="share" id="share" type="button">分享这张</button><small class="note">判断只看可验证的画面信号：识别到的人数、明显闭眼和清晰度。表情好不好、构图喜不喜欢，最后还是你决定。</small></div></section></main><script src="./app.js?v=202608131354"></script></body></html>

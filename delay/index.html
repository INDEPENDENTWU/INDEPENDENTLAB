<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0e0d"><meta name="description" content="延时镜。相机画面延迟几秒显示并可循环回看，直接查看后脑、背面衣服和看不到的位置。"><meta property="og:title" content="延时镜"><meta property="og:description" content="相机画面延迟几秒显示并可循环回看。"><title>延时镜</title><link rel="stylesheet" href="./style.css?v=202608120617"><link rel="stylesheet" href="../assets/microcopy.css?v=202608131955"></head><body><main class="shell" id="home"><header class="top"><a href="../" class="identity" aria-label="回首页"><span class="mark" aria-hidden="true"><i></i><b></b><em></em></span><span>延时镜</span></a></header><section class="intro"><div class="hero" aria-hidden="true"><i class="now"></i><i class="past"></i><b>5</b></div><div class="copy"><span class="serial">09</span><h1>延时镜</h1><p>相机画面延迟几秒显示并可循环回看，直接查看后脑、背面衣服和看不到的位置。</p></div><button class="start" id="start" type="button"><span>打开延时镜</span><b aria-hidden="true">↗</b></button><small class="privacy">退出后清除这次画面。</small><p class="error" id="error" hidden role="alert"></p></section></main><section class="mirror" id="mirror" hidden><header class="mirror-top"><button id="exit" type="button">退出</button><div class="status"><strong id="statusTitle">正在准备</strong><span id="statusSub">延迟 5 秒</span></div><button id="flip" type="button">翻转</button></header><div class="viewport" id="viewport"><video id="video" playsinline muted></video><img id="pastFrame" alt="延迟画面"><div class="warm" id="warm"><strong id="warmValue">5.0</strong><span>正在积累画面</span></div><div class="time-stamp" id="timeStamp" hidden>5 秒前</div></div><footer class="mirror-bottom" id="liveControls"><button class="delay" id="delay" type="button"><span>延迟</span><strong id="delayValue">5 秒</strong></button><button class="replay-trigger" id="freeze" type="button" disabled><i aria-hidden="true"></i><span>回看刚才</span></button><button class="direction" id="direction" type="button"><span>方向</span><strong id="directionValue">镜像</strong></button></footer><section class="review" id="review" hidden><div class="review-head"><div class="review-state"><strong>循环回看</strong><span id="reviewAgo">5.0 秒前</span></div><div class="review-tools"><button id="loopToggle" type="button">暂停</button><button id="zoom" type="button">1×</button><button id="resume" type="button">继续</button></div></div><input id="scrub" type="range" min="0" max="0" value="0" step="1" aria-label="回看最近画面"><div class="review-actions"><button id="saveFrame" type="button"><span id="saveFrameLabel">保存这一帧</span><b>↗</b></button></div></section><canvas id="bufferCanvas" hidden></canvas></section><script src="./app.js?v=202608120617"></script></body></html>

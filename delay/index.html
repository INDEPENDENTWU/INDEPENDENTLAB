<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0e0d"><meta name="description" content="延时镜。打开相机后延迟几秒显示画面，用来查看后脑、背面衣服和自己平时看不到的位置。"><meta property="og:title" content="延时镜"><meta property="og:description" content="打开相机后延迟几秒显示画面，用来查看后脑、背面衣服和自己平时看不到的位置。"><title>延时镜</title><link rel="stylesheet" href="./style.css?v=202608120548"></head><body><main class="shell" id="home"><header class="top"><a href="../" class="identity" aria-label="回首页"><span class="mark" aria-hidden="true"><i></i><b></b><em></em></span><span>延时镜</span></a></header><section class="intro"><div class="hero" aria-hidden="true"><i class="now"></i><i class="past"></i><b>5</b></div><div class="copy"><span class="serial">09</span><h1>延时镜</h1><p>打开相机后延迟几秒显示画面，用来查看后脑、背面衣服和自己平时看不到的位置。</p></div><button class="start" id="start" type="button"><span>打开延时镜</span><b aria-hidden="true">↗</b></button><small>画面只在当前设备临时处理，退出后自动清除。</small><p class="error" id="error" hidden role="alert"></p></section></main><section class="mirror" id="mirror" hidden><header class="mirror-top"><button id="exit" type="button">退出</button><div class="status"><strong id="statusTitle">正在准备</strong><span id="statusSub">延迟 5 秒</span></div><button id="flip" type="button">翻转</button></header><div class="viewport" id="viewport"><video id="video" playsinline muted></video><img id="pastFrame" alt="延迟画面"><div class="warm" id="warm"><strong id="warmValue">5.0</strong><span>正在积累画面</span></div><div class="time-stamp" id="timeStamp" hidden>5 秒前</div></div><footer class="mirror-bottom" id="liveControls"><button class="delay" id="delay" type="button"><span>延迟</span><strong id="delayValue">5 秒</strong></button><button class="freeze" id="freeze" type="button" disabled><i></i><span>定格</span></button><div class="bottom-spacer"></div></footer><section class="review" id="review" hidden><div class="review-head"><span id="reviewAgo">5.0 秒前</span><button id="resume" type="button">继续</button></div><input id="scrub" type="range" min="0" max="0" value="0" step="1" aria-label="回看最近画面"><div class="review-actions"><button id="saveFrame" type="button"><span id="saveFrameLabel">保存这一帧</span><b>↗</b></button></div></section><canvas id="bufferCanvas" hidden></canvas></section><script src="./app.js?v=202608120548"></script></body></html>

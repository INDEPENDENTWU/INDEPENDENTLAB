<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#efeee9"><meta name="description" content="回声尺。用手机自己的扬声器和麦克风，通过多次重复回声估算墙距或房间宽度。"><meta property="og:title" content="回声尺"><meta property="og:description" content="用多次编码声寻找重复出现的墙面反射；反射不明确时不输出距离。"><title>回声尺</title><link rel="stylesheet" href="./style.css?v=202608121510"><link rel="stylesheet" href="./refine.css?v=202608121510"></head><body><main class="shell" id="home"><header class="top"><a class="identity" href="../" aria-label="回首页"><span class="mark" aria-hidden="true"><i></i><b></b><em></em></span><span>回声尺</span></a></header><section class="intro"><div class="hero" aria-hidden="true"><i></i><b></b><em></em><span>≈1.84</span></div><div class="copy"><span class="serial">13</span><h1>回声尺</h1><p>让手机播放多次编码声并监听反射，估算手机到墙面的距离；检测到多个同样稳定的反射时不会给出数字。</p></div><div class="mode-choice" id="modeChoice" role="group" aria-label="测量用途"><button type="button" class="active" data-mode="wall"><strong>墙距</strong><small>手机到墙面</small></button><button type="button" data-mode="room"><strong>房间宽度</strong><small>前墙 + 后墙</small></button></div><button class="start" id="start" type="button"><span id="startLabel">测一下墙距</span><b aria-hidden="true">↗</b></button><small class="note">手机保持不动，媒体音量中等偏高，不要连接耳机。复杂家具、软墙面和多重反射会降低可用性。</small><p class="error" id="error" hidden role="alert"></p></section></main><section class="meter" id="meter" hidden><header class="meter-top"><button id="exit" type="button">退出</button><div class="status"><strong id="statusTitle">正在准备</strong><span id="statusSub">保持手机不动</span></div><button id="cancel" type="button">取消</button></header><div class="measure"><div class="wall" aria-hidden="true"></div><div class="phone" aria-hidden="true"><i></i></div><div class="arcs" aria-hidden="true"><i></i><i></i><i></i></div><div class="progress"><strong id="progressValue">1 / 7</strong><span id="progressText">正在比对回声</span></div></div><section class="result" id="result" hidden><header><span id="resultLabel">墙距</span><strong id="resultQuality">—</strong></header><div class="distance"><strong id="distanceValue">—</strong><span id="distanceUnit">m</span></div><div class="detail"><span id="repeatDetail">—</span><span id="echoDetail">—</span></div><div class="room-step" id="roomStep" hidden><span>第一面墙</span><strong id="firstWallValue">—</strong><p>保持在两面相对的墙之间，转身让手机朝向另一面墙。</p><button id="measureSecond" type="button">测另一面墙 <b>↗</b></button></div><div class="calibration" id="calibrationPanel" hidden><span>校准这台手机</span><p>如果手边有真尺，输入当前手机到墙面的真实距离。只用于修正这台设备较稳定的系统偏差。</p><div><input id="calibrationInput" type="number" min="0.55" max="5.5" step="0.01" inputmode="decimal" placeholder="例如 2.00" aria-label="真实墙距"><em>m</em><button id="saveCalibration" type="button">保存校准</button></div><small id="calibrationState">—</small></div><div class="result-actions" id="resultActions"><button class="primary" id="again" type="button">再测一次</button><button id="calibrateToggle" type="button">用真尺校准</button><button id="finish" type="button">结束</button></div><p class="quality-note" id="qualityNote">—</p></section></section><script src="./app.js?v=202608121510"></script></body></html>

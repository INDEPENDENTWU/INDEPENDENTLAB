<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#efeee9"><meta name="description" content="回声尺。让手机发出短声并监听回声，估算到墙面的距离，也可以连续测量两面墙得到房间宽度。"><meta property="og:title" content="回声尺"><meta property="og:description" content="用手机自己的扬声器和麦克风，通过回声估算墙距或房间宽度。"><title>回声尺</title><link rel="stylesheet" href="./style.css?v=202608121453"></head><body><main class="shell" id="home"><header class="top"><a class="identity" href="../" aria-label="回首页"><span class="mark" aria-hidden="true"><i></i><b></b><em></em></span><span>回声尺</span></a></header><section class="intro"><div class="hero" aria-hidden="true"><i></i><b></b><em></em><span>1.84</span></div><div class="copy"><span class="serial">13</span><h1>回声尺</h1><p>让手机发出几次短声并监听回声，估算手机到墙面的距离；连续测量两面相对的墙，还可以得到房间宽度。</p></div><div class="mode-choice" id="modeChoice" role="group" aria-label="测量用途"><button type="button" class="active" data-mode="wall"><strong>墙距</strong><small>手机到墙面</small></button><button type="button" data-mode="room"><strong>房间宽度</strong><small>前墙 + 后墙</small></button></div><button class="start" id="start" type="button"><span id="startLabel">测一下墙距</span><b aria-hidden="true">↗</b></button><small class="note">测量时让手机底边朝向较大的平整墙面，周围尽量安静。会播放几次很短的测试声。</small><p class="error" id="error" hidden role="alert"></p></section></main><section class="meter" id="meter" hidden><header class="meter-top"><button id="exit" type="button">退出</button><div class="status"><strong id="statusTitle">正在准备</strong><span id="statusSub">保持手机不动</span></div><button id="cancel" type="button">取消</button></header><div class="measure"><div class="wall" aria-hidden="true"></div><div class="phone" aria-hidden="true"><i></i></div><div class="arcs" aria-hidden="true"><i></i><i></i><i></i></div><div class="progress"><strong id="progressValue">1 / 5</strong><span id="progressText">正在听回声</span></div></div><section class="result" id="result" hidden><header><span id="resultLabel">墙距</span><strong id="resultQuality">—</strong></header><div class="distance"><strong id="distanceValue">—</strong><span id="distanceUnit">m</span></div><div class="detail"><span id="repeatDetail">—</span><span id="echoDetail">—</span></div><div class="room-step" id="roomStep" hidden><span>第一面墙</span><strong id="firstWallValue">—</strong><p>保持在两面相对的墙之间，转身让手机底边朝向另一面墙。</p><button id="measureSecond" type="button">测另一面墙 <b>↗</b></button></div><div class="result-actions" id="resultActions"><button class="primary" id="again" type="button">再测一次</button><button id="finish" type="button">结束</button></div><p class="quality-note" id="qualityNote">—</p></section></section><script src="./app.js?v=202608121453"></script></body></html>

<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f0eee8"><meta name="description" content="过线计数。固定相机并放好两道感应带，自动记录穿过的人或物体。"><meta property="og:title" content="过线计数"><meta property="og:description" content="固定相机并放好两道感应带，自动记录穿过的人或物体。"><title>过线计数</title><link rel="stylesheet" href="./style.css?v=202608122318"><link rel="stylesheet" href="./v2.css?v=202608122318"><link rel="stylesheet" href="../assets/microcopy.css?v=202608131955"></head><body><main class="shell" id="home"><header class="top"><a href="../" class="identity" aria-label="回首页"><span class="mark" aria-hidden="true"><i></i><b></b><em></em></span><span>过线计数</span></a></header><section class="intro"><div class="hero" aria-hidden="true"><i class="zone-a"></i><i class="line"></i><i class="zone-b"></i><b>12</b><em>↗</em></div><div class="copy"><span class="serial">11</span><h1>过线计数</h1><p>固定相机，把两道感应带横在必经位置。人或物体依次穿过两道感应带后自动计一次。</p></div><div class="mode-choice" id="modeChoice" role="group" aria-label="计数用途"><button type="button" data-mode="flow" class="active"><strong>进出</strong><small>两个方向 + 净进入</small></button><button type="button" data-mode="item"><strong>计件</strong><small>总数 + 速度 + 间隔</small></button><button type="button" data-mode="lap"><strong>圈数</strong><small>圈数 + 圈时 + 最快</small></button></div><button class="start" id="start" type="button"><span id="startLabel">打开进出计数</span><b aria-hidden="true">↗</b></button><small class="privacy">适合单个或单列通过；两道感应带要横在移动路径上。</small><p class="error" id="error" hidden role="alert"></p></section></main><section class="counter" id="counter" hidden><header class="counter-top"><button id="exit" type="button">退出</button><div class="status"><strong id="statusTitle">正在准备</strong><span id="statusSub">两道感应带附近先空两秒</span></div><button id="pause" type="button">暂停</button></header><div class="viewport" id="viewport"><video id="video" playsinline muted></video><div class="gate horizontal" id="gate" style="--gate:56%;--seg-start:12%;--seg-end:88%"><i class="sensor a"><span>1</span></i><button class="gate-line" id="gateLine" type="button" aria-label="拖动移动感应门"></button><button class="segment-handle start-handle" id="startHandle" type="button" aria-label="拖动调整感应范围起点"></button><button class="segment-handle end-handle" id="endHandle" type="button" aria-label="拖动调整感应范围终点"></button><i class="sensor b"><span>2</span></i></div><div class="cross-state" id="crossState"><i id="crossDot"></i><strong id="crossStateText">等待穿越</strong></div><div class="calibrate" id="calibrate"><strong id="calValue">2.0</strong><span>两道感应带附近先空着</span></div><div class="stats flow-stats" id="flowStats"><div><span id="arrowA">↓</span><strong id="countA">0</strong><small>方向一</small></div><div class="stat-primary"><span>净进入</span><strong id="netCount">0</strong><small id="netNote">↓ 进入 · ↑ 离开</small></div><div><span id="arrowB">↑</span><strong id="countB">0</strong><small>方向二</small></div></div><div class="stats metric-stats" id="itemStats" hidden><div class="stat-primary"><span>总数</span><strong id="itemTotal">0</strong><small id="itemDirection">只计 ↓</small></div><div><span>速度</span><strong id="itemRate">—</strong><small>个 / 分钟</small></div><div><span>平均间隔</span><strong id="itemInterval">—</strong><small>秒</small></div></div><div class="stats metric-stats" id="lapStats" hidden><div class="stat-primary"><span>圈数</span><strong id="lapCount">0</strong><small id="lapDirection">经过 ↓ 计一圈</small></div><div><span>上一圈</span><strong id="lastLap">—</strong><small>秒</small></div><div><span>最快</span><strong id="bestLap">—</strong><small id="avgLap">平均 —</small></div></div><div class="flash" id="flash" hidden>+1</div></div><footer class="counter-bottom"><div class="tools" id="tools"><button id="orientation" type="button"><span>感应带方向</span><strong id="orientationValue">横向</strong></button><button id="direction" type="button"><span>计数方向</span><strong id="directionValue">进门 ↓</strong></button><button id="reset" type="button"><span>本次数据</span><strong>清零</strong></button></div><p id="bottomHint">先穿 1、再穿 2 计 ↓；反过来计 ↑。</p></footer><canvas id="analysis" width="224" height="160" hidden></canvas></section><script src="./v2.js?v=202608122318"></script></body></html>

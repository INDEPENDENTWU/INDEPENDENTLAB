<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f0eee8"><meta name="description" content="过线计数。把相机固定在门口、通道、传送带或跑道旁，物体穿过指定线段时自动计数，并输出方向、速度或圈时。"><meta property="og:title" content="过线计数"><meta property="og:description" content="固定相机后，让穿过指定线段的人或物体自动变成可用的计数数据。"><title>过线计数</title><link rel="stylesheet" href="./style.css?v=202608121343"></head><body><main class="shell" id="home"><header class="top"><a href="../" class="identity" aria-label="回首页"><span class="mark" aria-hidden="true"><i></i><b></b><em></em></span><span>过线计数</span></a></header><section class="intro"><div class="hero" aria-hidden="true"><i class="zone-a"></i><i class="line"></i><i class="zone-b"></i><b>12</b><em>↗</em></div><div class="copy"><span class="serial">11</span><h1>过线计数</h1><p>把相机固定在门口、通道、传送带或跑道旁，穿过指定线段的人或物体会自动变成计数数据。</p></div><div class="mode-choice" id="modeChoice" role="group" aria-label="计数用途"><button type="button" data-mode="flow" class="active"><strong>进出</strong><small>两个方向 + 净进入</small></button><button type="button" data-mode="item"><strong>计件</strong><small>总数 + 速度 + 间隔</small></button><button type="button" data-mode="lap"><strong>圈数</strong><small>圈数 + 圈时 + 最快</small></button></div><button class="start" id="start" type="button"><span id="startLabel">打开进出计数</span><b aria-hidden="true">↗</b></button><small class="privacy">画面只在当前设备实时分析，不保存视频。</small><p class="error" id="error" hidden role="alert"></p></section></main><section class="counter" id="counter" hidden><header class="counter-top"><button id="exit" type="button">退出</button><div class="status"><strong id="statusTitle">正在准备</strong><span id="statusSub">有效线段附近先空两秒</span></div><button id="pause" type="button">暂停</button></header><div class="viewport" id="viewport"><video id="video" playsinline muted></video><div class="gate vertical" id="gate" style="--gate:50%;--seg-start:18%;--seg-end:82%"><i class="sensor a"></i><button class="gate-line" id="gateLine" type="button" aria-label="拖动移动计数线"></button><button class="segment-handle start-handle" id="startHandle" type="button" aria-label="拖动调整线段起点"></button><button class="segment-handle end-handle" id="endHandle" type="button" aria-label="拖动调整线段终点"></button><i class="sensor b"></i></div><div class="calibrate" id="calibrate"><strong id="calValue">2.0</strong><span>有效线段附近先空着</span></div><div class="stats flow-stats" id="flowStats"><div><span id="arrowA">→</span><strong id="countA">0</strong><small>方向一</small></div><div class="stat-primary"><span>净进入</span><strong id="netCount">0</strong><small id="netNote">方向一 − 方向二</small></div><div><span id="arrowB">←</span><strong id="countB">0</strong><small>方向二</small></div></div><div class="stats metric-stats" id="itemStats" hidden><div class="stat-primary"><span>总数</span><strong id="itemTotal">0</strong><small id="itemDirection">只计 →</small></div><div><span>速度</span><strong id="itemRate">—</strong><small>个 / 分钟</small></div><div><span>平均间隔</span><strong id="itemInterval">—</strong><small>秒</small></div></div><div class="stats metric-stats" id="lapStats" hidden><div class="stat-primary"><span>圈数</span><strong id="lapCount">0</strong><small id="lapDirection">经过 → 计一圈</small></div><div><span>上一圈</span><strong id="lastLap">—</strong><small>秒</small></div><div><span>最快</span><strong id="bestLap">—</strong><small id="avgLap">平均 —</small></div></div><div class="flash" id="flash" hidden>+1</div></div><footer class="counter-bottom"><div class="tools" id="tools"><button id="orientation" type="button"><span>标线</span><strong id="orientationValue">竖线</strong></button><button id="direction" type="button"><span>计数方向</span><strong id="directionValue">→</strong></button><button id="reset" type="button"><span>本次数据</span><strong>清零</strong></button></div><p id="bottomHint">拖白线移动位置，拖两端缩短线段，只保留真正会穿过的通道。</p></footer><canvas id="analysis" width="192" height="128" hidden></canvas></section><script src="./app.js?v=202608121343"></script></body></html>

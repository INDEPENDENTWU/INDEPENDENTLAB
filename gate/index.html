<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f0eee8"><meta name="description" content="过线计数。把相机对准固定位置，有人或物体穿过标线时自动计数，并区分两个方向。"><meta property="og:title" content="过线计数"><meta property="og:description" content="把相机对准固定位置，有人或物体穿过标线时自动计数，并区分两个方向。"><title>过线计数</title><link rel="stylesheet" href="./style.css?v=202608121316"></head><body><main class="shell" id="home"><header class="top"><a href="../" class="identity" aria-label="回首页"><span class="mark" aria-hidden="true"><i></i><b></b><em></em></span><span>过线计数</span></a></header><section class="intro"><div class="hero" aria-hidden="true"><i class="zone-a"></i><i class="line"></i><i class="zone-b"></i><b>12</b><em>↗</em></div><div class="copy"><span class="serial">11</span><h1>过线计数</h1><p>把相机对准固定位置，有人或物体穿过标线时自动计数，并区分两个方向。</p></div><button class="start" id="start" type="button"><span>打开计数器</span><b aria-hidden="true">↗</b></button><small class="privacy">画面只在当前设备实时分析，不保存视频。</small><p class="error" id="error" hidden role="alert"></p></section></main><section class="counter" id="counter" hidden><header class="counter-top"><button id="exit" type="button">退出</button><div class="status"><strong id="statusTitle">正在准备</strong><span id="statusSub">标线附近先空两秒</span></div><button id="pause" type="button">暂停</button></header><div class="viewport" id="viewport"><video id="video" playsinline muted></video><div class="gate vertical" id="gate" style="--gate:50%"><i class="sensor a"></i><button class="gate-line" id="gateLine" type="button" aria-label="拖动调整标线位置"></button><i class="sensor b"></i></div><div class="calibrate" id="calibrate"><strong id="calValue">2.0</strong><span>标线附近先空着</span></div><div class="counts"><div><span id="arrowA">→</span><strong id="countA">0</strong></div><div><span id="arrowB">←</span><strong id="countB">0</strong></div></div><div class="flash" id="flash" hidden>+1</div></div><footer class="counter-bottom"><div class="tools"><button id="orientation" type="button"><span>标线</span><strong id="orientationValue">竖线</strong></button><button id="reset" type="button"><span>计数</span><strong>清零</strong></button></div><p>保持手机固定。拖动标线到真正的通行位置。</p></footer><canvas id="analysis" width="160" height="120" hidden></canvas></section><script src="./app.js?v=202608121316"></script></body></html>

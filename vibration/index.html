<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#eef0eb"><meta name="description" content="振动计。把手机稳放在机器、桌面或物体上，测量振动强度、峰值和主要频率，并比较调整前后的变化。"><meta property="og:title" content="振动计"><meta property="og:description" content="用手机自身的运动传感器测量物体振动，并比较调整前后的变化。"><title>振动计</title><link rel="stylesheet" href="./style.css?v=202608121401"><link rel="stylesheet" href="../assets/microcopy.css?v=202608131955"></head><body><main class="shell" id="home"><header class="top"><a class="identity" href="../" aria-label="回首页"><span class="mark" aria-hidden="true"><i></i><b></b><em></em></span><span>振动计</span></a></header><section class="intro"><div class="hero" aria-hidden="true"><i></i><i></i><i></i><b>Hz</b></div><div class="copy"><span class="serial">12</span><h1>振动计</h1><p>把手机稳放在机器、桌面或物体上，测量振动强度、峰值和主要频率，并比较调整前后的变化。</p></div><button class="start" id="start" type="button"><span id="startLabel">开始测量</span><b aria-hidden="true">↗</b></button><small class="note">手机要稳稳接触被测物体。不要放在可能甩落、发热或高速旋转的部件上。</small><p class="error" id="error" hidden role="alert"></p></section></main><section class="meter" id="meter" hidden><header class="meter-top"><button id="exit" type="button">退出</button><div class="status"><strong id="statusTitle">正在准备</strong><span id="statusSub">放稳手机</span></div><button id="cancel" type="button">取消</button></header><div class="measure-body"><canvas id="trace" width="960" height="360" aria-hidden="true"></canvas><div class="measure-overlay" id="overlay"><strong id="overlayValue">2.0</strong><span id="overlayText">放稳手机</span></div><div class="live-readout"><span>实时振动</span><strong id="liveValue">0.00</strong><small>m/s²</small></div></div><section class="result" id="result" hidden><header><span>本次测量</span><strong id="resultTime">10 秒</strong></header><div class="metrics"><div><span>振动强度</span><strong id="rmsValue">—</strong><small>RMS · m/s²</small></div><div><span>峰值</span><strong id="peakValue">—</strong><small>m/s²</small></div><div><span>主要频率</span><strong id="freqValue">—</strong><small id="freqNote">Hz</small></div></div><div class="compare" id="compare" hidden><span>相比基准</span><strong id="compareValue">—</strong><small id="compareNote">—</small></div><div class="result-actions"><button class="primary" id="baseline" type="button">设为基准</button><button id="again" type="button">再测一次</button><button id="finish" type="button">结束</button></div><p id="quality">—</p></section></section><script src="./app.js?v=202608121401"></script></body></html>

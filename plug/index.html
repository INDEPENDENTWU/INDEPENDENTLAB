<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#efeee8"><meta name="description" content="插头排位。告诉它每个大充电头会挡住哪一侧插孔，自动排出尽量把所有设备都插下的顺序。"><meta property="og:title" content="插头排位"><meta property="og:description" content="几个大充电头互相挡，先算好哪个插哪孔。"><title>插头排位</title><link rel="stylesheet" href="./style.css?v=202608130430"></head><body><main class="shell"><header class="top"><a class="identity" href="../" aria-label="回首页"><span class="mark" aria-hidden="true"><i></i><b></b><em></em></span><span>插头排位</span></a></header><section class="intro" id="intro"><div class="hero" aria-hidden="true"><span class="rail"></span><i></i><i></i><i></i><i></i><i></i><b></b><em></em></div><div class="copy"><span class="serial">16</span><h1>插头排位</h1><p>插孔明明够，大充电头却互相挡。告诉它每个插头会挡左边、右边还是两边，自动排出尽量全部插下的顺序。</p></div><section class="setup"><div class="strip-head"><strong>这根插排</strong><div class="count-control"><button id="minus" type="button" aria-label="减少插孔">−</button><span><b id="socketCount">6</b> 孔</span><button id="plus" type="button" aria-label="增加插孔">＋</button></div></div><div class="strip-preview" id="stripPreview" aria-label="插排预览"></div><div class="devices-head"><strong>手上的插头</strong><button id="add" type="button">＋ 加一个</button></div><div class="devices" id="devices"></div><button class="start" id="solve" type="button"><span>排一下</span><b aria-hidden="true">↗</b></button><small>这里只算插头外壳会不会挡住相邻插孔，不判断功率、额定负载或电气安全。</small></section></section><section class="result" id="result" hidden><header class="result-top"><button id="back" type="button">返回</button><div><strong>插头排位</strong><span id="resultMeta">—</span></div><button id="reset" type="button">重来</button></header><div class="result-body"><section class="verdict"><span>建议插法</span><strong id="verdict">—</strong><p id="verdictNote">—</p></section><div class="plan-strip" id="planStrip"></div><ol class="plan-list" id="planList"></ol><section class="not-fit" id="notFit" hidden><span>这次没塞下</span><strong id="notFitNames">—</strong><p>可以先换一个方向、把最宽的插头移到插排两端，或者使用合规的短延长线释放被挡住的孔位。</p></section><button class="again" id="edit" type="button">改一下再排</button><small class="safety">结果只表示物理上是否互相遮挡。实际使用仍应遵守插排和设备标注的额定功率与安全要求。</small></div></section></main><script src="./app.js?v=202608130430"></script></body></html>
